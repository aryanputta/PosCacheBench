[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poscachebench"
version = "0.1.0"
description = "Benchmark positional-attention geometry under KV-cache budget pressure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
poscachebench = "poscachebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

